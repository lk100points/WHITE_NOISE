name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build WHITE NOISE for Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.0.85f2
          buildMethod: WhiteNoiseBuild.BuildWindows

      - name: Package Windows build
        shell: bash
        run: |
          set -euo pipefail
          test -f Build/Windows/WHITE_NOISE.exe
          test -d Build/Windows/WHITE_NOISE_Data
          ARCHIVE="$RUNNER_TEMP/WHITE_NOISE-Windows-x64.zip"
          rm -f "$ARCHIVE"
          cd Build
          zip -r "$ARCHIVE" Windows
          test -s "$ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WHITE_NOISE-Windows-x64
          path: ${{ runner.temp }}/WHITE_NOISE-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
